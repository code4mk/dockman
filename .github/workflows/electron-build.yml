name: Build and Publish Electron App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.17.1'
    
    - name: Install pnpm
      run: npm install -g pnpm
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Pipenv
      run: python3 -m pip install pipenv
    
    - name: Build backend
      working-directory: ./backend
      run: |
        pipenv install
        pipenv run python ./pyinstaller-build.py
    
    - name: Install dependencies
      run: |
        pnpm install --force

    - name: Build Electron App for ${{ matrix.os }}
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        if [[ "${{ matrix.os }}" == 'ubuntu-latest' ]]; then
          pnpm run build:linux
        elif [[ "${{ matrix.os }}" == 'macos-latest' ]]; then
          pnpm run build:mac
        elif [[ "${{ matrix.os }}" == 'windows-latest' ]]; then
          pnpm run build:win
        fi
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      with:
        upload_url: https://uploads.github.com/repos/${{ github.repository }}/releases/${{ github.ref_tag }}/assets
        asset_path: ./dist/electron-app-${{ matrix.os }}.zip
        asset_name: electron-app-${{ matrix.os }}.zip
        asset_content_type: application/zip
